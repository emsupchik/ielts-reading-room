<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="z2qYDrC18_uW8Fw_OiOHi3a0vF_MPUNNsvrAV0Jr8xs" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Reading Room — IELTS Academic Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A22;
    --ink-soft:#28392F;
    --paper:#F1EDE1;
    --paper-card:#FBF9F3;
    --paper-line:#DAD3C0;
    --accent:#8A5A32;
    --accent-soft:#C99A63;
    --text:#242017;
    --muted:#736C5C;
    --correct:#2E6E4E;
    --correct-bg:#E7F0E7;
    --incorrect:#A63F30;
    --incorrect-bg:#F3E4DF;
    --radius:3px;
    --serif:'Fraunces', Georgia, serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --shadow: 0 1px 2px rgba(27,42,34,0.06), 0 8px 24px rgba(27,42,34,0.06);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--accent-soft); color:var(--ink); }

  a{ color:inherit; }

  /* ---------- App shell ---------- */
  .app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header.top{
    background:var(--ink);
    color:#EFE9DA;
    padding:22px 32px 0 32px;
  }
  .top-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    max-width:1180px;
    margin:0 auto;
    padding-bottom:18px;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    font-family:var(--serif);
    font-weight:600;
    font-size:22px;
    letter-spacing:0.2px;
  }
  .brand small{
    display:block;
    font-family:var(--sans);
    font-weight:400;
    font-size:12.5px;
    color:#B9AE95;
    margin-top:2px;
    letter-spacing:0.2px;
  }

  nav.modes{
    display:flex;
    gap:2px;
    max-width:1180px;
    margin:0 auto;
  }
  .mode-btn{
    appearance:none;
    border:none;
    background:transparent;
    color:#C9BFA9;
    font-family:var(--sans);
    font-size:15px;
    font-weight:500;
    padding:12px 22px;
    cursor:pointer;
    position:relative;
    transition:color .25s ease;
  }
  .mode-btn:hover{ color:#EFE9DA; }
  .mode-btn.active{ color:#EFE9DA; }
  .mode-btn.active::after{
    content:"";
    position:absolute;
    left:22px; right:22px; bottom:0;
    height:2px;
    background:var(--accent-soft);
    border-radius:2px;
  }

  /* subnav pills */
  .subnav{
    background:var(--paper-card);
    border-bottom:1px solid var(--paper-line);
    padding:14px 32px;
    position:sticky;
    top:0;
    z-index:5;
  }
  .subnav-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .pill{
    appearance:none;
    border:1px solid var(--paper-line);
    background:transparent;
    color:var(--muted);
    font-family:var(--sans);
    font-size:13.5px;
    font-weight:500;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
    white-space:nowrap;
  }
  .pill:hover{ border-color:var(--accent-soft); color:var(--ink); }
  .pill.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#EFE9DA;
  }

  main{
    flex:1;
    max-width:1180px;
    width:100%;
    margin:0 auto;
    padding:36px 32px 80px 32px;
  }

  .fade-in{
    animation:fadeIn .35s ease both;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .fade-in, .stagger{ animation:none !important; transition:none !important; }
  }

  .task-header{
    margin-bottom:22px;
  }
  .task-eyebrow{
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
  }
  .task-header h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:32px;
    margin:0 0 8px 0;
    color:var(--ink);
  }
  .task-header p{
    color:var(--muted);
    font-size:14.5px;
    max-width:640px;
    line-height:1.55;
    margin:0;
  }

  .split{
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width:920px){
    .split{ grid-template-columns:1fr; }
  }

  .panel{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .passage{
    padding:30px 32px;
    max-height:640px;
    overflow-y:auto;
  }
  .passage h2{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 14px 0;
    color:var(--ink);
  }
  .passage p{
    font-size:15px;
    line-height:1.75;
    color:var(--text);
    margin:0 0 14px 0;
  }
  .passage .section-label{
    display:inline-block;
    font-family:var(--serif);
    font-weight:600;
    color:var(--accent);
    font-size:15px;
    margin-right:6px;
  }
  .passage .gloss{
    font-size:12.5px;
    color:var(--muted);
    border-top:1px solid var(--paper-line);
    margin-top:18px;
    padding-top:14px;
  }

  .questions{
    padding:30px 32px;
  }
  .questions h2{
    font-family:var(--serif);
    font-size:19px;
    margin:0 0 6px 0;
    color:var(--ink);
  }
  .questions .instructions{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.55;
    margin-bottom:20px;
  }

  .word-box{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    background:var(--paper);
    border:1px dashed var(--paper-line);
    padding:12px 14px;
    border-radius:var(--radius);
    margin-bottom:22px;
  }
  .word-box span{
    font-size:12.5px;
    color:var(--ink-soft);
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    padding:4px 10px;
    border-radius:14px;
  }

  .q-row{
    padding:14px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .q-row:first-of-type{ padding-top:0; }
  .q-row:last-of-type{ border-bottom:none; }

  .q-num{
    font-family:var(--serif);
    font-weight:600;
    color:var(--accent);
    font-size:14px;
    margin-right:8px;
  }
  .q-prompt{
    font-size:14.5px;
    color:var(--text);
    margin-bottom:10px;
    line-height:1.5;
  }

  input[type="text"], select{
    width:100%;
    font-family:var(--sans);
    font-size:14.5px;
    padding:9px 12px;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--text);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input[type="text"]:focus, select:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(138,90,50,0.14);
  }

  .radio-group{ display:flex; flex-direction:column; gap:8px; }
  .radio-opt{
    display:flex;
    align-items:flex-start;
    gap:9px;
    font-size:14px;
    color:var(--text);
    cursor:pointer;
    padding:6px 8px;
    border-radius:var(--radius);
    transition:background .15s ease;
  }
  .radio-opt:hover{ background:var(--paper); }
  .radio-opt input{ margin-top:3px; }

  .result-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    padding:3px 10px;
    border-radius:12px;
    margin-left:8px;
    vertical-align:middle;
  }
  .result-tag.correct{ background:var(--correct-bg); color:var(--correct); }
  .result-tag.incorrect{ background:var(--incorrect-bg); color:var(--incorrect); }

  .explanation{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
    line-height:1.55;
    background:var(--paper);
    border-left:2px solid var(--paper-line);
    padding:9px 12px;
    display:none;
  }
  .q-row.checked .explanation{ display:block; }
  .q-row.checked.incorrect .explanation{ border-left-color:var(--incorrect); }
  .q-row.checked.correct .explanation{ border-left-color:var(--correct); }

  .checked input[type="text"], .checked select{
    border-color:var(--paper-line);
  }
  .q-row.checked.correct input[type="text"], .q-row.checked.correct select{
    border-color:var(--correct);
  }
  .q-row.checked.incorrect input[type="text"], .q-row.checked.incorrect select{
    border-color:var(--incorrect);
  }

  .action-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:24px;
    gap:14px;
    flex-wrap:wrap;
  }
  .btn{
    appearance:none;
    border:none;
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    padding:12px 22px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:transform .12s ease, background .2s ease, opacity .2s ease;
  }
  .btn-primary{
    background:var(--ink);
    color:#EFE9DA;
  }
  .btn-primary:hover{ background:var(--ink-soft); }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--paper-line);
  }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--accent-soft); }

  .score-pill{
    font-size:13.5px;
    color:var(--ink);
    font-weight:600;
    background:var(--paper);
    border:1px solid var(--paper-line);
    padding:8px 16px;
    border-radius:20px;
    display:none;
  }
  .score-pill.show{ display:inline-block; animation:fadeIn .3s ease; }

  /* ---------- Writing ---------- */
  .writing-layout{
    display:grid;
    grid-template-columns:1fr;
    gap:28px;
  }
  .prompt-card{
    padding:28px 32px;
  }
  .prompt-card .prompt-box{
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:18px 20px;
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
    font-style:italic;
    font-family:var(--serif);
    margin:16px 0;
  }
  .meta-row{
    display:flex;
    gap:18px;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
    flex-wrap:wrap;
  }

  .chart-wrap{ margin:20px 0; }
  .chart-wrap svg{ width:100%; height:auto; display:block; }

  textarea{
    width:100%;
    min-height:280px;
    font-family:var(--sans);
    font-size:15px;
    line-height:1.7;
    padding:18px 20px;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--text);
    resize:vertical;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  textarea:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(138,90,50,0.14);
  }

  .word-count{
    font-size:13px;
    color:var(--muted);
    margin-top:8px;
  }
  .word-count.ok{ color:var(--correct); }
  .word-count.low{ color:var(--incorrect); }

  .feedback{
    margin-top:26px;
    display:none;
  }
  .feedback.show{ display:block; animation:fadeIn .4s ease; }

  .check-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--paper-line);
    font-size:14px;
  }
  .check-row:last-child{ border-bottom:none; }
  .dot{
    width:8px; height:8px; border-radius:50%;
    flex-shrink:0;
  }
  .dot.ok{ background:var(--correct); }
  .dot.warn{ background:var(--incorrect); }

  .criteria-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:18px;
  }
  @media (max-width:760px){ .criteria-grid{ grid-template-columns:1fr; } }
  .criteria-card{
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .criteria-card h3{
    font-family:var(--serif);
    font-size:15px;
    margin:0 0 8px 0;
    color:var(--ink);
  }
  .criteria-card p{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    margin:0;
  }

  details.samples{
    margin-top:22px;
    border-top:1px solid var(--paper-line);
    padding-top:18px;
  }
  details.samples summary{
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    list-style:none;
  }
  details.samples summary::-webkit-details-marker{ display:none; }
  details.samples summary::before{
    content:"+ ";
    color:var(--accent);
  }
  details.samples[open] summary::before{ content:"– "; }

  .sample{
    margin-top:16px;
    padding:16px 18px;
    background:var(--paper);
    border-radius:var(--radius);
    border:1px solid var(--paper-line);
  }
  .sample-band{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    background:var(--accent-soft);
    padding:3px 10px;
    border-radius:10px;
    margin-bottom:8px;
  }
  .sample-comment{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
  }

  footer.credits{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    padding:24px 0 40px 0;
  }

  @media (max-width:640px){
    header.top{ padding:18px 18px 0 18px; }
    .subnav{ padding:12px 18px; }
    main{ padding:26px 18px 60px 18px; }
    .passage, .questions, .prompt-card{ padding:22px 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">The Reading Room<small>IELTS Academic — self-paced practice</small></div>
    </div>
    <nav class="modes">
      <button class="mode-btn active" data-mode="reading">Academic Reading</button>
      <button class="mode-btn" data-mode="writing">Academic Writing</button>
    </nav>
  </header>

  <div class="subnav">
    <div class="subnav-inner" id="subnav"></div>
  </div>

  <main id="main"></main>

  <footer class="credits">Practice material adapted from official IELTS Academic sample tasks.</footer>
</div>

<script>
/* ================= DATA ================= */

const READING_TASKS = [
  {
    id:'diagram',
    label:'Diagram Labelling',
    title:'Diagram Label Completion',
    subject:'Dung beetles',
    instructions:'Label the tunnels on the diagram using words from the box below. One word has already been used as an example is not needed here — choose freely from the box.',
    wordBox:['French','Spanish','Mediterranean','South African','Australian native','South African ball roller'],
    passage:[
      `Introducing dung beetles into a pasture is a simple process: approximately 1,500 beetles are released, a handful at a time, into fresh cow pats in the cow pasture. The beetles immediately disappear beneath the pats digging and tunnelling and, if they successfully adapt to their new environment, soon become a permanent, self-sustaining part of the local ecology. In time they multiply and within three or four years the benefits to the pasture are obvious.`,
      `Dung beetles work from the inside of the pat so they are sheltered from predators such as birds and foxes. Most species burrow into the soil and bury dung in tunnels directly underneath the pats, which are hollowed out from within. Some large species originating from France excavate tunnels to a depth of approximately 30 cm below the dung pat. These beetles make sausage-shaped brood chambers along the tunnels. The shallowest tunnels belong to a much smaller Spanish species that buries dung in chambers that hang like fruit from the branches of a pear tree. South African beetles dig narrow tunnels of approximately 20 cm below the surface of the pat. Some surface-dwelling beetles, including a South African species, cut perfectly-shaped balls from the pat, which are rolled away and attached to the bases of plants.`,
      `For maximum dung burial in spring, summer and autumn, farmers require a variety of species with overlapping periods of activity. In the cooler environments of the state of Victoria, the large French species (2.5 cms long), is matched with smaller (half this size), temperate-climate Spanish species. The former are slow to recover from the winter cold and produce only one or two generations of offspring from late spring until autumn. The latter, which multiply rapidly in early spring, produce two to five generations annually. The South African ball-rolling species, being a sub-tropical beetle, prefers the climate of northern and coastal New South Wales where it commonly works with the South African tunnelling species. In warmer climates, many species are active for longer periods of the year.`
    ],
    glossary:['dung: the droppings or excreta of animals','cow pats: droppings of cows'],
    diagram:true,
    questions:[
      {num:6, depth:'20 cm', type:'text', answers:['south african'], explanation:'The passage states South African beetles dig narrow tunnels of approximately 20 cm below the surface, matching the middle depth on the diagram.'},
      {num:7, depth:'30 cm', type:'text', answers:['french'], explanation:'The French species excavates the deepest tunnels of the group described, to approximately 30 cm below the dung pat.'},
      {num:8, depth:'near surface', type:'text', answers:['spanish'], explanation:'The Spanish species has the shallowest tunnels, described as hanging chambers "like fruit from the branches of a pear tree," placing it nearest the surface.'}
    ]
  },
  {
    id:'identifying-info',
    label:'Identifying Information',
    title:'Identifying Information',
    subject:'Motor vehicles and society',
    instructions:'The passage below has eight paragraphs, A–H. Choose the letter of the paragraph that contains each piece of information. You may use any letter more than once.',
    passage:[
      `<span class="section-label">A</span> There are now over 700 million motor vehicles in the world - and the number is rising by more than 40 million each year. The average distance driven by car users is growing too - from 8km a day per person in western Europe in 1965 to 25 km a day in 1995. This dependence on motor vehicles has given rise to major problems, including environmental pollution, depletion of oil resources, traffic congestion and safety.`,
      `<span class="section-label">B</span> While emissions from new cars are far less harmful than they used to be, city streets and motorways are becoming more crowded than ever, often with older trucks, buses and taxis which emit excessive levels of smoke and fumes. This concentration of vehicles makes air quality in urban areas unpleasant and sometimes dangerous to breathe. Even Moscow has joined the list of capitals afflicted by congestion and traffic fumes. In Mexico City, vehicle pollution is a major health hazard.`,
      `<span class="section-label">C</span> Until a hundred years ago, most journeys were in the 20km range, the distance conveniently accessible by horse. Heavy freight could only be carried by water or rail. Invention of the motor vehicle brought personal mobility to the masses and made rapid freight delivery possible over a much wider area. In the United Kingdom, about 90 per cent of inland freight is carried by road. The world cannot revert to the horse-drawn wagon. Can it avoid being locked into congested and polluting ways of transporting people and goods?`,
      `<span class="section-label">D</span> In Europe most cities are still designed for the old modes of transport. Adaptation to the motor car has involved adding ring roads, one-way systems and parking lots. In the United States, more land is assigned to car use than to housing. Urban sprawl means that life without a car is next to impossible. Mass use of motor vehicles has also killed or injured millions of people. Other social effects have been blamed on the car such as alienation and aggressive human behaviour.`,
      `<span class="section-label">E</span> A 1993 study by the European Federation for Transport and Environment found that car transport is seven times as costly as rail travel in terms of the external social costs it entails - congestion, accidents, pollution, loss of cropland and natural habitats, depletion of oil resources, and so on. Yet cars easily surpass trains or buses as a flexible and convenient mode of personal transport. It is unrealistic to expect people to give up private cars in favour of mass transit.`,
      `<span class="section-label">F</span> Technical solutions can reduce the pollution problem and increase the fuel efficiency of engines. But fuel consumption and exhaust emissions depend on which cars are preferred by customers and how they are driven. Many people buy larger cars than they need for daily purposes or waste fuel by driving aggressively. Besides, global car use is increasing at a faster rate than the improvement in emissions and fuel efficiency which technology is now making possible.`,
      `<span class="section-label">G</span> Some argue that the only long-term solution is to design cities and neighbourhoods so that car journeys are not necessary - all essential services being located within walking distance or easily accessible by public transport. Not only would this save energy and cut carbon dioxide emissions, it would also enhance the quality of community life, putting the emphasis on people instead of cars. Good local government is already bringing this about in some places. But few democratic communities are blessed with the vision - and the capital - to make such profound changes in modern lifestyles.`,
      `<span class="section-label">H</span> A more likely scenario seems to be a combination of mass transit systems for travel into and around cities, with small 'low emission' cars for urban use and larger hybrid or lean burn cars for use elsewhere. Electronically tolled highways might be used to ensure that drivers pay charges geared to actual road use. Better integration of transport systems is also highly desirable - and made more feasible by modern computers. But these are solutions for countries which can afford them. In most developing countries, old cars and old technologies continue to predominate.`
    ],
    questions:[
      {num:14, prompt:'a comparison of past and present transportation methods', type:'select-letter', letters:['A','B','C','D','E','F','G','H'], answer:'C', explanation:'Paragraph C contrasts journeys "until a hundred years ago" (horse-drawn, 20km range) with the mobility and freight capacity brought by the motor vehicle.'},
      {num:15, prompt:'how driving habits contribute to road problems', type:'select-letter', letters:['A','B','C','D','E','F','G','H'], answer:'F', explanation:'Paragraph F discusses how people buy larger cars than needed and drive aggressively, wasting fuel and worsening emissions.'},
      {num:16, prompt:'the relative merits of cars and public transport', type:'select-letter', letters:['A','B','C','D','E','F','G','H'], answer:'E', explanation:'Paragraph E weighs the high social cost of cars against their flexibility compared with trains or buses.'},
      {num:17, prompt:"the writer's prediction on future solutions", type:'select-letter', letters:['A','B','C','D','E','F','G','H'], answer:'H', explanation:'Paragraph H opens with "A more likely scenario seems to be..." — a direct prediction about future transport solutions.'},
      {num:18, prompt:'the increasing use of motor vehicles', type:'select-letter', letters:['A','B','C','D','E','F','G','H'], answer:'A', explanation:'Paragraph A opens the passage with statistics on the rising number of vehicles and distance driven.'},
      {num:19, prompt:'the impact of the car on city development', type:'select-letter', letters:['A','B','C','D','E','F','G','H'], answer:'D', explanation:'Paragraph D describes how European and American cities have physically adapted to accommodate cars.'}
    ]

/* ================= STATE ================= */
let state = { mode:'reading', readingTaskId: READING_TASKS[0].id, writingTaskId: WRITING_TASKS[0].id };

/* ================= HELPERS ================= */
function norm(s){
  return (s||'').toString().trim().toLowerCase()
    .replace(/[.,]/g,'')
    .replace(/-/g,' ')
    .replace(/\s+/g,' ');
}
function isCorrectText(value, answers){
  const v = norm(value);
  return answers.some(a => norm(a) === v);
}

/* ================= RENDER: SUBNAV ================= */
function renderSubnav(){
  const el = document.getElementById('subnav');
  el.innerHTML='';
  const tasks = state.mode==='reading' ? READING_TASKS : WRITING_TASKS;
  const activeId = state.mode==='reading' ? state.readingTaskId : state.writingTaskId;
  tasks.forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'pill' + (t.id===activeId ? ' active':'');
    btn.textContent = t.label;
    btn.onclick = ()=>{
      if(state.mode==='reading') state.readingTaskId = t.id;
      else state.writingTaskId = t.id;
      renderSubnav();
      renderMain();
    };
    el.appendChild(btn);
  });
}

/* ================= RENDER: READING ================= */
function renderReading(){
  const task = READING_TASKS.find(t=>t.id===state.readingTaskId);
  const main = document.getElementById('main');

  let passageHtml = `<div class="panel passage"><h2>${task.subject}</h2>`;
  task.passage.forEach(p=>{ passageHtml += `<p>${p}</p>`; });
  if(task.groups){
    passageHtml += `<div class="word-box">`;
    task.groups.forEach(g=>{ passageHtml += `<span>${g[0]} — ${g[1]}</span>`; });
    passageHtml += `</div>`;
  }
  if(task.glossary){
    passageHtml += `<div class="gloss">${task.glossary.join('<br>')}</div>`;
  }
  passageHtml += `</div>`;

  let questionsHtml = `<div class="panel questions"><h2>Questions</h2><div class="instructions">${task.instructions}</div>`;

  if(task.wordBox){
    questionsHtml += `<div class="word-box">`;
    task.wordBox.forEach(w=>{ questionsHtml += `<span>${w}</span>`; });
    questionsHtml += `</div>`;
  }

  if(task.diagram){
    questionsHtml += renderDiagram(task);
  } else if(task.table){
    questionsHtml += renderTable(task);
  } else if(task.sections){
    questionsHtml += renderHeadingSections(task);
  } else {
    task.questions.forEach(q=>{
      questionsHtml += renderQuestionRow(q);
    });
  }

  questionsHtml += `
    <div class="action-row">
      <button class="btn btn-primary" onclick="checkReading('${task.id}')">Check answers</button>
      <span class="score-pill" id="score-pill"></span>
    </div>
  </div>`;

  main.innerHTML = `
    <div class="task-header fade-in">
      <div class="task-eyebrow">Academic Reading</div>
      <h1>${task.title}</h1>
      <p>Read the passage, answer every question, then press Check answers to see which are correct and why.</p>
    </div>
    <div class="split fade-in">${passageHtml}${questionsHtml}</div>
  `;
}

function renderQuestionRow(q){
  let inner = '';
  if(q.type==='text'){
    inner = `<input type="text" id="q-${q.num}" placeholder="Type your answer" />`;
  } else if(q.type==='select-letter'){
    inner = `<select id="q-${q.num}"><option value="">— choose a letter —</option>`;
    q.letters.forEach(l=>{ inner += `<option value="${l}">${l}</option>`; });
    inner += `</select>`;
  } else if(q.type==='select-tgn'){
    inner = `<select id="q-${q.num}"><option value="">— choose —</option>
      <option value="YES">YES</option>
      <option value="NO">NO</option>
      <option value="NOT GIVEN">NOT GIVEN</option>
    </select>`;
  } else if(q.type==='radio'){
    inner = `<div class="radio-group">`;
    q.options.forEach(o=>{
      inner += `<label class="radio-opt"><input type="radio" name="q-${q.num}" value="${o[0]}"><span><strong>${o[0]}.</strong> ${o[1]}</span></label>`;
    });
    inner += `</div>`;
  }
  return `
    <div class="q-row" id="row-${q.num}">
      <div class="q-prompt"><span class="q-num">${q.num}</span>${q.prompt || ''}</div>
      ${inner}
      <div class="explanation" id="exp-${q.num}"></div>
    </div>`;
}

function renderHeadingSections(task){
  let html = `<div class="word-box">`;
  task.headingsList.forEach(h=>{ html += `<span>${h[0]}. ${h[1]}</span>`; });
  html += `</div>`;
  task.sections.forEach(s=>{
    if(s.example){
      html += `<div class="q-row">
        <div class="q-prompt"><span class="q-num">Section ${s.letter}</span> (Example)</div>
        <select disabled><option>${s.answer} — ${task.headingsList.find(h=>h[0]===s.answer)[1]}</option></select>
      </div>`;
    } else {
      html += `<div class="q-row" id="row-${s.num}">
        <div class="q-prompt"><span class="q-num">${s.num}</span>Section ${s.letter}</div>
        <select id="q-${s.num}"><option value="">— choose a heading —</option>`;
      task.headingsList.forEach(h=>{ html += `<option value="${h[0]}">${h[0]}. ${h[1]}</option>`; });
      html += `</select>
        <div class="explanation" id="exp-${s.num}"></div>
      </div>`;
    }
  });
  return html;
}

function checkReading(taskId){
  const task = READING_TASKS.find(t=>t.id===taskId);
  let questions = task.questions;
  if(task.sections){
    questions = task.sections.filter(s=>!s.example).map(s=>({num:s.num, type:'select-letter', answer:s.answer, explanation:s.explanation}));
  }
  let correctCount = 0;
  questions.forEach(q=>{
    const row = document.getElementById('row-'+q.num);
    const exp = document.getElementById('exp-'+q.num);
    let userVal = '';
    let ok = false;

    if(q.type==='radio'){
      const checked = document.querySelector(`input[name="q-${q.num}"]:checked`);
      userVal = checked ? checked.value : '';
      ok = userVal === q.answer;
    } else {
      const field = document.getElementById('q-'+q.num);
      userVal = field ? field.value : '';
      if(q.type==='text'){
        ok = isCorrectText(userVal, q.answers);
      } else {
        ok = userVal === q.answer;
      }
    }

    row.classList.remove('correct','incorrect');
    row.classList.add('checked', ok ? 'correct' : 'incorrect');
    if(ok) correctCount++;

    const existingTag = row.querySelector('.result-tag');
    if(existingTag) existingTag.remove();
    const tag = document.createElement('span');
    tag.className = 'result-tag ' + (ok ? 'correct':'incorrect');
    tag.textContent = ok ? 'Correct' : 'Incorrect';
    row.querySelector('.q-prompt').appendChild(tag);

    const correctAnswerText = q.answer || (q.answers ? q.answers[0] : '');
    exp.innerHTML = (ok ? '' : `<strong>Correct answer:</strong> ${correctAnswerText}. `) + (q.explanation || '');
  });

  const pill = document.getElementById('score-pill');
  pill.textContent = `${correctCount} / ${questions.length} correct`;
  pill.classList.add('show');
}

function renderWriting(){
  const task = WRITING_TASKS.find(t=>t.id===state.writingTaskId);
  const main = document.getElementById('main');

  let chartHtml = '';
  if(task.id==='task1'){
    chartHtml = `<div class="chart-wrap">` + buildBarChart() + `</div>`;
  }

  let criteriaHtml = `<div class="criteria-grid">`;
  task.criteria.forEach(c=>{
    criteriaHtml += `<div class="criteria-card"><h3>${c.name}</h3><p>${c.text}</p></div>`;
  });
  criteriaHtml += `</div>`;

  let samplesHtml = '';
  task.samples.forEach(s=>{
    samplesHtml += `<div class="sample">
      <span class="sample-band">${s.band}</span>
      <div class="sample-comment"><strong>${s.label}:</strong> ${s.comment}</div>
    </div>`;
  });

  main.innerHTML = `
    <div class="task-header fade-in">
      <div class="task-eyebrow">Academic Writing</div>
      <h1>${task.title}</h1>
      <p>Write your response below, then press Check to review it against the official IELTS band descriptors.</p>
    </div>
    <div class="writing-layout fade-in">
      <div class="panel prompt-card">
        <div class="meta-row"><span>You should spend ${task.time} on this task.</span><span>Minimum ${task.minWords} words.</span></div>
        <div class="prompt-box">${task.prompt}</div>
        <p style="font-size:14px;color:var(--muted);line-height:1.6;">${task.instruction}</p>
        ${chartHtml}
        <textarea id="essay" placeholder="Start writing here..."></textarea>
        <div class="word-count" id="word-count">0 words</div>

        <div class="action-row">
          <button class="btn btn-primary" onclick="checkWriting('${task.id}')">Check</button>
        </div>

        <div class="feedback" id="writing-feedback">
          <div class="check-row" id="wc-check"></div>
          <div class="check-row" id="para-check"></div>

          <details class="samples" open style="margin-top:20px;">
            <summary>Assessment criteria for this task</summary>
            ${criteriaHtml}
          </details>

          <details class="samples">
            <summary>Compare with real candidate scripts</summary>
            ${samplesHtml}
          </details>
        </div>
      </div>
    </div>
  `;

  const essay = document.getElementById('essay');
  const wc = document.getElementById('word-count');
  essay.addEventListener('input', ()=>{
    const words = countWords(essay.value);
    wc.textContent = `${words} words`;
    wc.classList.toggle('ok', words>=task.minWords);
    wc.classList.toggle('low', words>0 && words<task.minWords);
  });
}

function countWords(text){
  const t = text.trim();
  if(!t) return 0;
  return t.split(/\s+/).length;
}

function checkWriting(taskId){
  const task = WRITING_TASKS.find(t=>t.id===taskId);
  const essay = document.getElementById('essay').value;
  const words = countWords(essay);
  const paragraphs = essay.split(/\n\s*\n/).filter(p=>p.trim().length>0).length;

  const wcCheck = document.getElementById('wc-check');
  const paraCheck = document.getElementById('para-check');

  const wcOk = words >= task.minWords;
  wcCheck.innerHTML = `<span class="dot ${wcOk?'ok':'warn'}"></span> ${words} words written — ${wcOk ? `meets the ${task.minWords}-word minimum.` : `below the ${task.minWords}-word minimum required by the task.`}`;

  const paraOk = paragraphs >= 3;
  paraCheck.innerHTML = `<span class="dot ${paraOk?'ok':'warn'}"></span> ${paragraphs} paragraph${paragraphs===1?'':'s'} detected — ${paraOk ? 'a clear paragraph structure supports Coherence and Cohesion.' : 'consider organising your answer into distinct paragraphs (introduction, body points, conclusion).'}`;

  document.getElementById('writing-feedback').classList.add('show');
}

function buildBarChart(){
  const data = {
    male:   { full:[100,140,225], part:[1000,850,900] },
    female: { full:[60,200,230],  part:[700,820,1100] }
  };
  const years = ['1970/71','1980/81','1990/91'];
  const maxVal = 1200;
  const chartH = 220, chartW = 520, baseY = 20, groupW = 70, barW = 16, gap = 6;
  let x = 60;
  let bars = '';
  let labels = '';

  function drawGroup(fullVal, partVal, xPos, year){
    const partH = (partVal/maxVal)*chartH;
    const fullH = (fullVal/maxVal)*chartH;
    bars += `<rect x="${xPos}" y="${baseY+chartH-partH}" width="${barW}" height="${partH}" fill="#C99A63" opacity="0.55"/>`;
    bars += `<rect x="${xPos+barW+gap}" y="${baseY+chartH-fullH}" width="${barW}" height="${fullH}" fill="#28392F"/>`;
    labels += `<text x="${xPos+barW}" y="${baseY+chartH+18}" font-size="10" fill="#736C5C" font-family="Inter" text-anchor="middle">${year}</text>`;
  }

  let svg = `<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<text x="150" y="16" font-size="12" fill="#28392F" font-family="Inter" font-weight="600" text-anchor="middle">Male</text>`;
  svg += `<text x="460" y="16" font-size="12" fill="#28392F" font-family="Inter" font-weight="600" text-anchor="middle">Female</text>`;

  // axis
  svg += `<line x1="55" y1="${baseY}" x2="55" y2="${baseY+chartH}" stroke="#DAD3C0"/>`;
  [0,200,400,600,800,1000,1200].forEach(v=>{
    const y = baseY + chartH - (v/maxVal)*chartH;
    svg += `<line x1="55" y1="${y}" x2="580" y2="${y}" stroke="#DAD3C0" stroke-width="0.5"/>`;
    svg += `<text x="48" y="${y+3}" font-size="9" fill="#736C5C" font-family="Inter" text-anchor="end">${v}</text>`;
  });

  let gx = 80;
  years.forEach((y,i)=>{ drawGroup(data.male.full[i], data.male.part[i], gx, y); gx += groupW; });
  gx += 30;
  years.forEach((y,i)=>{ drawGroup(data.female.full[i], data.female.part[i], gx, y); gx += groupW; });

  svg += bars + labels;
  svg += `<rect x="180" y="270" width="12" height="12" fill="#C99A63" opacity="0.55"/><text x="197" y="280" font-size="10" fill="#28392F" font-family="Inter">Part-time education</text>`;
  svg += `<rect x="350" y="270" width="12" height="12" fill="#28392F"/><text x="367" y="280" font-size="10" fill="#28392F" font-family="Inter">Full-time education</text>`;
  svg += `<text x="10" y="150" font-size="9" fill="#736C5C" font-family="Inter" transform="rotate(-90 10,150)">Thousands</text>`;
  svg += `</svg>`;
  return svg;
}
